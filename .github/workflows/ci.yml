name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    name: Backend (lint, typecheck, test, build, e2e)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: botleilao
          POSTGRES_PASSWORD: botleilao_secret
          POSTGRES_DB: botleilao
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U botleilao -d botleilao"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://botleilao:botleilao_secret@localhost:5432/botleilao?schema=public
      JWT_SECRET: ci-jwt-secret-please-change-1234567890
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-please-change-1234567890

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npm run prisma:generate

      - name: Aplicar migrações
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes unitários
        run: npm test

      - name: Build
        run: npm run build

      - name: Testes e2e
        run: npm run test:e2e

  frontend:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
