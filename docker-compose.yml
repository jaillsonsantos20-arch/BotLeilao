name: botleilao

services:
  postgres:
    image: postgres:16-alpine
    container_name: botleilao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-botleilao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-botleilao_secret}
      POSTGRES_DB: ${POSTGRES_DB:-botleilao}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-botleilao} -d ${POSTGRES_DB:-botleilao}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: botleilao-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: botleilao-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-botleilao}:${POSTGRES_PASSWORD:-botleilao_secret}@postgres:5432/${POSTGRES_DB:-botleilao}?schema=public
      REDIS_HOST: redis
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - wwebjs_auth:/app/.wwebjs_auth
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: botleilao-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  wwebjs_auth:
  uploads_data:
